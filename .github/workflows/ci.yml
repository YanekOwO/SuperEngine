name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Auto-cancel superseded runs on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache APT packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('apt-deps.txt') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install system deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $(cat apt-deps.txt)

      - name: Cache SDL3
        id: cache-sdl3
        uses: actions/cache@v4
        with:
          path: ~/sdl3-prefix
          key: ${{ runner.os }}-sdl3-3.2.30-sdl3ttf-3.2.2-hb

      - name: Build SDL3 from source
        if: steps.cache-sdl3.outputs.cache-hit != 'true'
        run: |
          curl -sL https://github.com/libsdl-org/SDL/releases/download/release-3.2.30/SDL3-3.2.30.tar.gz | tar xz -C /tmp
          cmake -S /tmp/SDL3-3.2.30 -B /tmp/sdl3-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$HOME/sdl3-prefix \
            -DCMAKE_INSTALL_LIBDIR=lib -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build /tmp/sdl3-build && cmake --install /tmp/sdl3-build

          curl -sL https://github.com/libsdl-org/SDL_ttf/releases/download/release-3.2.2/SDL3_ttf-3.2.2.tar.gz | tar xz -C /tmp
          cmake -S /tmp/SDL3_ttf-3.2.2 -B /tmp/sdl3ttf-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$HOME/sdl3-prefix \
            -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_PREFIX_PATH=$HOME/sdl3-prefix \
            -DSDLTTF_VENDORED=OFF -DSDLTTF_SAMPLES=OFF -DSDLTTF_STRICT=ON -DSDLTTF_PLUTOSVG=OFF
          cmake --build /tmp/sdl3ttf-build && cmake --install /tmp/sdl3ttf-build

      - name: Export SDL3 environment
        run: |
          echo "PKG_CONFIG_PATH=$HOME/sdl3-prefix/lib/pkgconfig" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$HOME/sdl3-prefix" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$HOME/sdl3-prefix/lib" >> $GITHUB_ENV

      - name: Configure
        run: |
          cmake --preset release

      - name: Run clang-tidy
        run: |
          set -euo pipefail
          # Collect C++ sources
          ALL_SRC=$(git ls-files 'src/**/*.cpp')

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # Files changed in this PR (against merge base)
            BASE_SHA=$(git merge-base origin/${{ github.base_ref }} HEAD)
            CHANGED=$(git diff --name-only "$BASE_SHA"...HEAD -- 'src/**/*.cpp' | tr '\n' ' ')
            FILES=${CHANGED:-$ALL_SRC}
          else
            FILES=$ALL_SRC
          fi

          # Fallback to all if none detected
          FILES=${FILES:-$ALL_SRC}

          echo "Running clang-tidy on:"
          echo "$FILES"

          run-clang-tidy -p build/release/ -j"$(nproc)" $FILES -- -std=c++20

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache APT packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('apt-deps.txt') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install system deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $(cat apt-deps.txt)

      - name: Cache SDL3
        id: cache-sdl3
        uses: actions/cache@v4
        with:
          path: ~/sdl3-prefix
          key: ${{ runner.os }}-sdl3-3.2.30-sdl3ttf-3.2.2-hb

      - name: Build SDL3 from source
        if: steps.cache-sdl3.outputs.cache-hit != 'true'
        run: |
          curl -sL https://github.com/libsdl-org/SDL/releases/download/release-3.2.30/SDL3-3.2.30.tar.gz | tar xz -C /tmp
          cmake -S /tmp/SDL3-3.2.30 -B /tmp/sdl3-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$HOME/sdl3-prefix \
            -DCMAKE_INSTALL_LIBDIR=lib -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build /tmp/sdl3-build && cmake --install /tmp/sdl3-build

          curl -sL https://github.com/libsdl-org/SDL_ttf/releases/download/release-3.2.2/SDL3_ttf-3.2.2.tar.gz | tar xz -C /tmp
          cmake -S /tmp/SDL3_ttf-3.2.2 -B /tmp/sdl3ttf-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$HOME/sdl3-prefix \
            -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_PREFIX_PATH=$HOME/sdl3-prefix \
            -DSDLTTF_VENDORED=OFF -DSDLTTF_SAMPLES=OFF -DSDLTTF_STRICT=ON -DSDLTTF_PLUTOSVG=OFF
          cmake --build /tmp/sdl3ttf-build && cmake --install /tmp/sdl3ttf-build

      - name: Export SDL3 environment
        run: |
          echo "PKG_CONFIG_PATH=$HOME/sdl3-prefix/lib/pkgconfig" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$HOME/sdl3-prefix" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$HOME/sdl3-prefix/lib" >> $GITHUB_ENV

      - name: Enable ccache cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache-${{ github.job }}

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.25'

      - name: Configure (Ninja + ccache)
        run: |
          cmake --preset ci-tests

      - name: Build
        run: |
          cmake --build --preset ci-tests

      - name: Run tests
        run: |
          ctest --preset ci-tests -j"$(nproc)"
